name: Publish BigQuery

on:
  workflow_dispatch:
    inputs:
      partition_facts:
        description: Partition facts by purchase date (disable for historical Sandbox loads)
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: bigquery-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: bigquery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check environment configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "$GCP_PROJECT_ID"
          test -n "$GCP_WIF_PROVIDER"
          test -n "$GCP_SERVICE_ACCOUNT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Validate before obtaining cloud credentials
        run: |
          pytest -q
          retail download --raw-dir data/raw
          retail run --raw-dir data/raw --output-dir data/processed --source-kind olist
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Publish validated snapshot, then promote views
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BQ_DATASET: ${{ vars.BQ_DATASET || 'retail_analytics' }}
          BQ_LOCATION: ${{ vars.BQ_LOCATION || 'US' }}
          BQ_PARTITION_FACTS: ${{ inputs.partition_facts }}
        run: |
          extra_args=()
          if [[ "$BQ_PARTITION_FACTS" == "false" ]]; then
            extra_args+=(--no-partitioning)
          fi
          retail bigquery --project "$GCP_PROJECT_ID" --dataset "$BQ_DATASET" --location "$BQ_LOCATION" "${extra_args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bigquery-publication-evidence
          retention-days: 14
          path: |
            data/processed/latest.json
            data/processed/runs/*/bigquery_publication.json
            data/processed/runs/*/summary.json
            data/processed/runs/*/reconciliation.json
