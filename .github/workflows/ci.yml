name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies and project
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and integration tests
        run: pytest --cov=retail_analytics --cov-report=xml --cov-report=term-missing
      - name: Synthetic pipeline smoke test
        run: retail run --raw-dir tests/fixtures/olist --output-dir artifacts/synthetic --source-kind synthetic
      - name: Power BI schema and binding checks
        run: python scripts/validate_powerbi.py
      - name: Wheel build
        run: python -m build
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python }}
          retention-days: 7
          path: |
            coverage.xml
            artifacts/synthetic/latest.json
            artifacts/synthetic/runs/*/summary.json
            artifacts/synthetic/runs/*/quality.json
            artifacts/synthetic/runs/*/reconciliation.json

